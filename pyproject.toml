[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mym-indice-mercado-chile"
version = "2.0.0"
description = "Herramienta abierta de MyM Ingenierías para analizar condiciones de mercado en Chile"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Lautaro Parada Opazo"}]
maintainers = [{name = "MyM Ingenierías"}]
dependencies = [
  "bcch @ git+https://github.com/LautaroParada/bcch-sdk.git@ddea162b4a340b5b09ef13d6c8da9dd3f63ab1d2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "python-dotenv>=1.0,<2",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
imc-chile = "indice:main"

[project.urls]
Homepage = "https://mymingenierias.com"
Repository = "https://github.com/LautaroParada/Indice-de-miedo-y-codicia"

[tool.setuptools]
py-modules = ["indice"]

[tool.setuptools.packages.find]
include = ["imc*", "research*"]

[tool.setuptools.package-data]
research = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
